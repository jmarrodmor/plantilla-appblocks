plugins {
    id 'com.android.application'
}

android {
    namespace 'es.appblocks.plantilla'
    compileSdk 34

    defaultConfig {
        // Identificador de relleno: AppBlocks lo cambia por uno distinto para cada app (misma longitud)
        applicationId 'es.appblocks.zzzzzzzzzzzzzzzzzzzzzzzz'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}
